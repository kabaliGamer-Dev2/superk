<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pale Ivory Background (#F3F0E7) - remove <rect> for transparent master -->
  <rect width="512" height="512" rx="96" fill="#F3F0E7"/>
  
  <!-- Super-Orbit Ring (Tilted Monoline Ellipse with Clean Break) -->
  <g transform="rotate(-24 256 256)" fill="none" stroke="#2A2529" stroke-width="28" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="196" ry="118" stroke-dasharray="920 140" stroke-dashoffset="35"/>
  </g>
  
  <!-- Orbit Node Dot -->
  <circle cx="418" cy="148" r="18" fill="#2A2529"/>

  <!-- Monoline Geometric 'K' -->
  <g fill="none" stroke="#2A2529" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical Stem -->
    <line x1="196" y1="152" x2="196" y2="360"/>
    <!-- Upper Arm -->
    <line x1="202" y1="258" x2="316" y2="152"/>
    <!-- Lower Leg -->
    <line x1="236" y1="226" x2="322" y2="360"/>
  </g>
</svg>
